<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="eas-game.js" defer></script>
    <title>Etch-a-Sketch</title>
</head>
<body>
    <div class="playground">
        <div class="control-panel">
            <button class="grid-size-btn btn">Change grid size</button>

            <div class="tools">
                <button class="pen-btn btn">Pen</button>
                <!-- <button class="pencil-btn btn">Pencil</button> -->
            </div>

            <div class="colors">
                <div id="color-indicator"></div>
                <div class="color-actions">
                    <button class="choose-color-btn btn">Choose color</button>
                    <div class="dropdown-menu">
                        <button class="colorSel btn">black</button>
                        <button class="colorSel btn">white</button>
                        <button class="colorSel btn">aqua</button>
                        <button class="colorSel btn">aquamarine</button>
                        <button class="colorSel btn">bisque</button>
                        <button class="colorSel btn">blueviolet</button>
                        <button class="colorSel btn">cadetblue</button>
                        <button class="colorSel btn">coral</button>
                        <button class="colorSel btn">crimson</button>
                    </div>
                <button class="random-color-btn btn">Random color</button>
                </div>
                
            </div>
        </div>

        <div class="game">
            <div class="game-grid"></div>
        </div>
    </div>
</body>
</html>
