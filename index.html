<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="eas-game.js" defer></script>
    <title>Etch-a-Sketch</title>
</head>
<body>
    <div class="playground">
        <div class="control-panel">
            <button class="grid-size-btn btn">Change grid size</button>

            <div class="tools">
                <button class="pen-btn btn">Pen</button>
                <button class="pencil-btn btn">Pencil</button>
            </div>
            
            <div class="colors">
                <button class="choose-color-btn btn">Choose color</button>
                <button class="random-color-btn btn">Random color</button>
            </div>
        </div>

        <div class="game">
            <div class="game-grid"></div>
        </div>
    </div>
</body>
</html>
